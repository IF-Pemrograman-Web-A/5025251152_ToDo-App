<!DOCTYPE html>
<html lang="id">
<head>

    <title>Offline — ToDo App</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body{
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        main{
            width: 100%;
            max-width: 420px;
            padding: 32px;
            border-radius: 16px;
            background: #f5f5f5;
            text-align: center;
            box-shadow: 0 8px 24px #00000012;
        }

        img{
            width: 96px;
            height: 96px;
            border-radius: 16px;
        }

        h1{
            color: #0b7bb3;
        }

        p{
            line-height: 1.6;
        }

        a{
            display: inline-block;
            margin-top: 12px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #0b7bb3;
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <img src="./icons/icon-192.png" alt="ToDo App">
        <h1>Anda sedang offline</h1>

        <p>Coba kembali ke aplikasi atau periksa koneksi Anda.</p>
